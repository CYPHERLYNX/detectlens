[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "detectlens"
version = "0.1.0"
description = "Wazuh-native Detection Posture Management: ATT&CK coverage heatmap, dead/noisy rule findings, missing-telemetry detection, AI-assisted rule drafting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CYPHERLYNX" }]
keywords = ["wazuh", "siem", "detection", "mitre-attack", "soc", "posture"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
